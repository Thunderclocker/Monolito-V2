name: Carter Mercado Libre metadata

on:
  pull_request:
    branches: [ main ]

jobs:
  fetch-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch exact purchased listings
        shell: bash
        run: |
          mkdir -p metadata
          for id in MLA1460572707 MLA1608076332 MLA880805822; do
            curl --fail --location --retry 3 -A "Mozilla/5.0"               "https://api.mercadolibre.com/items/$id"               -o "metadata/$id.json"
            curl --fail --location --retry 3 -A "Mozilla/5.0"               "https://api.mercadolibre.com/items/$id/description"               -o "metadata/$id-description.json" || true
          done

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: carter-ml-purchase-metadata
          path: metadata/
          if-no-files-found: error
          retention-days: 1
