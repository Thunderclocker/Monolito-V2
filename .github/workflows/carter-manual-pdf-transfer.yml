name: Carter manual PDF transfer

on:
  pull_request:
    branches: [ main ]

jobs:
  fetch-manuals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download manuals
        shell: bash
        run: |
          mkdir -p manuals
          : > manuals/download-status.txt

          dl() {
            name="$1"
            url="$2"
            if curl --fail --location --retry 3 --retry-delay 2 -A "Mozilla/5.0" "$url" -o "manuals/$name"; then
              printf 'OK  %s\n' "$name" | tee -a manuals/download-status.txt
            else
              rm -f "manuals/$name"
              printf 'FAIL %s  %s\n' "$name" "$url" | tee -a manuals/download-status.txt
            fi
          }

          dl "Imou_Cruiser_SE_Plus_5MP_manual_en.pdf" "https://cdn.tvc.mx/media/1283138/IMOU-DHT0150054-CRUISER-SE-+-5MP-CAMARA-IP-PT-WIFI-FULLCOLOR-MANUAL-DE-USUARIO-INGLES-TVC.pdf"
          dl "Imou_IPC-K7CP-5H1WE_datasheet.pdf" "https://manuals.plus/m/9444a905b1dc4eefe10be0d49f41d8197ca5d6c0dda72da756f9e8fbc3a4e091.pdf"

          find manuals -maxdepth 1 -type f -name '*.pdf' -print0 | sort -z | xargs -0 -r sha256sum > manuals/SHA256SUMS.txt
          file manuals/*.pdf 2>/dev/null | tee manuals/file-types.txt || true
          cat manuals/download-status.txt

      - name: Upload original PDFs
        uses: actions/upload-artifact@v4
        with:
          name: carter-imou-pdfs
          path: manuals/
          if-no-files-found: error
          retention-days: 1
